<svg viewBox="0 0 900 560" width="900" height="560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ti de">
<title id="ti">Why 40% of generated evaluation questions were rejected</title>
<desc id="de">The extracted PDF text contains invisible typesetting characters: soft hyphens inside words and non-breaking spaces. A language model quoting the passage reproduces the words as a reader sees them, so an exact string comparison against the raw text fails even though the wording is identical.</desc>
<rect width="900" height="560" fill="#ffffff"/>
<style>
.lab{font:600 10px system-ui,-apple-system,sans-serif;fill:#8b867d;letter-spacing:.08em}
.mono{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#1f1e1c}
.mk{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#ffffff}
.nm{font:12px system-ui,-apple-system,sans-serif;fill:#1f1e1c}
.vl{font:11px system-ui,-apple-system,sans-serif;fill:#6f6b64}
.big{font:600 15px system-ui,-apple-system,sans-serif;fill:#1f1e1c}
.note{font:11px system-ui,-apple-system,sans-serif;fill:#6f6b64}
.rule{stroke:#e5e2dc;stroke-width:1}
.box{fill:none;stroke:#d8d5cf;stroke-width:1.5;rx:6}
</style>
<text class="lab" x="40" y="34">1 &#8212; WHAT THE EXTRACTED PDF TEXT ACTUALLY CONTAINS</text>
<rect class="box" x="40" y="46" width="820" height="40"/>
<text class="mono" x="54.0" y="71">… fremde Unterneh</text>
<rect x="185.6" y="59" width="9.8" height="17" rx="2" fill="#c9a27a"/>
<text class="mk" x="186.6" y="71">¬</text>
<text class="mono" x="194.4" y="71">men gelten. Für Unternehmer nach §</text>
<rect x="458.6" y="59" width="9.8" height="17" rx="2" fill="#c9a27a"/>
<text class="mk" x="459.6" y="71">␣</text>
<text class="mono" x="467.4" y="71">2 Absatz</text>
<rect x="528.8" y="59" width="9.8" height="17" rx="2" fill="#c9a27a"/>
<text class="mk" x="529.8" y="71">␣</text>
<text class="mono" x="537.6" y="71">1 …</text>
<text class="lab" x="40" y="122">2 &#8212; WHAT THE MODEL QUOTED, VERBATIM</text>
<rect class="box" x="40" y="134" width="820" height="40"/>
<text class="mono" x="54.0" y="159">… fremde Unternehmen gelten. Für Unternehmer nach § 2 Absatz 1 …</text>
<text class="big" x="40" y="212">Exact string comparison &#8594; no match. Same words. Only invisible characters differ.</text>
<text class="note" x="40" y="232">30 of 75 generated gold entries discarded &#8212; by a filter built to catch invented evidence.</text>
<line class="rule" x1="40" y1="262" x2="860" y2="262"/>
<text class="lab" x="40" y="290">3 &#8212; ARTEFACT PREVALENCE: REJECTED CHUNKS VS. WHOLE CORPUS</text>
<text class="nm" x="314" y="323" text-anchor="end">Soft hyphen  U+00AD</text>
<rect x="330" y="312" width="266.2" height="13" rx="2" fill="#c9a27a"/>
<text class="vl" x="603.2" y="323">71%</text>
<rect x="330" y="329" width="127.5" height="13" rx="2" fill="#8aa6b8"/>
<text class="vl" x="464.5" y="340">34%</text>
<text class="nm" x="314" y="367" text-anchor="end">Non-breaking space  U+00A0</text>
<rect x="330" y="356" width="146.2" height="13" rx="2" fill="#c9a27a"/>
<text class="vl" x="483.2" y="367">39%</text>
<rect x="330" y="373" width="97.5" height="13" rx="2" fill="#8aa6b8"/>
<text class="vl" x="434.5" y="384">26%</text>
<text class="nm" x="314" y="411" text-anchor="end">Hyphen at line break</text>
<rect x="330" y="400" width="135.0" height="13" rx="2" fill="#c9a27a"/>
<text class="vl" x="472.0" y="411">36%</text>
<rect x="330" y="417" width="97.5" height="13" rx="2" fill="#8aa6b8"/>
<text class="vl" x="434.5" y="428">26%</text>
<rect x="330" y="438" width="11" height="11" rx="2" fill="#c9a27a"/>
<text class="vl" x="348" y="447">rejected chunks</text>
<rect x="460" y="438" width="11" height="11" rx="2" fill="#8aa6b8"/>
<text class="vl" x="478" y="447">all 1,872 chunks</text>
<line class="rule" x1="40" y1="502" x2="860" y2="502"/>
<text class="big" x="40" y="528">Fix: normalise presentation, never wording &#8212; validation pass rate 71% &#8594; 100%</text>
<text class="note" x="40" y="546">Measured on 399 simulated quotes drawn from the real corpus. Fabricated quotes still rejected.</text>
</svg>