<svg viewBox="0 0 900 330" width="900" height="330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ti de">
<title id="ti">Where the MVP baseline loses answers</title>
<desc id="de">For each question form, the share of questions whose correct passage is found in the top five results, found in the candidate pool but ranked below five, or not retrieved at all. Colloquial questions are the harder case.</desc>
<rect width="900" height="330" fill="#ffffff"/>
<style>
.lab{font:600 10px system-ui,-apple-system,sans-serif;fill:#8b867d;letter-spacing:.08em}
.nm{font:600 13px system-ui,-apple-system,sans-serif;fill:#1f1e1c}
.seg{font:600 12px system-ui,-apple-system,sans-serif;fill:#ffffff}
.segd{font:600 12px system-ui,-apple-system,sans-serif;fill:#1f1e1c}
.vl{font:11px system-ui,-apple-system,sans-serif;fill:#6f6b64}
.note{font:11px system-ui,-apple-system,sans-serif;fill:#6f6b64}
.rule{stroke:#e5e2dc;stroke-width:1}
</style>
<text class="lab" x="40" y="34">RECALL@5 DECOMPOSITION &#183; 58 GOLD ENTRIES &#183; 116 QUESTIONS</text>
<line class="rule" x1="40" y1="44" x2="860" y2="44"/>
<line class="rule" x1="250" y1="62" x2="250" y2="238"/>
<text class="vl" x="250" y="58" text-anchor="middle">0%</text>
<line class="rule" x1="400" y1="62" x2="400" y2="238"/>
<text class="vl" x="400" y="58" text-anchor="middle">25%</text>
<line class="rule" x1="550" y1="62" x2="550" y2="238"/>
<text class="vl" x="550" y="58" text-anchor="middle">50%</text>
<line class="rule" x1="700" y1="62" x2="700" y2="238"/>
<text class="vl" x="700" y="58" text-anchor="middle">75%</text>
<line class="rule" x1="850" y1="62" x2="850" y2="238"/>
<text class="vl" x="850" y="58" text-anchor="middle">100%</text>
<text class="nm" x="232" y="124" text-anchor="end">colloquial</text>
<rect x="250.0" y="96" width="351.6" height="46" fill="#a8763f"/>
<text class="seg" x="425.8" y="124" text-anchor="middle">58.6</text>
<rect x="601.6" y="96" width="103.8" height="46" fill="#c9a27a"/>
<text class="seg" x="653.5" y="124" text-anchor="middle">17.3</text>
<rect x="705.4" y="96" width="144.6" height="46" fill="#e5d4bd"/>
<text class="segd" x="777.7" y="124" text-anchor="middle">24.1</text>
<text class="nm" x="232" y="202" text-anchor="end">precise</text>
<rect x="250.0" y="174" width="455.4" height="46" fill="#a8763f"/>
<text class="seg" x="477.7" y="202" text-anchor="middle">75.9</text>
<rect x="705.4" y="174" width="93.0" height="46" fill="#c9a27a"/>
<text class="seg" x="751.9" y="202" text-anchor="middle">15.5</text>
<rect x="798.4" y="174" width="51.6" height="46" fill="#e5d4bd"/>
<text class="segd" x="824.2" y="202" text-anchor="middle">8.6</text>
<rect x="40" y="247" width="11" height="11" rx="2" fill="#a8763f"/>
<text class="note" x="58" y="256">found in top 5</text>
<rect x="40" y="266" width="11" height="11" rx="2" fill="#c9a27a"/>
<text class="note" x="58" y="275">in the pool, ranked below 5  &#8212;  re-ranker headroom</text>
<rect x="40" y="285" width="11" height="11" rx="2" fill="#e5d4bd"/>
<text class="note" x="58" y="294">not retrieved at all  &#8212;  needs hybrid search / better chunking</text>
<text class="note" x="560" y="275">Dense retrieval only &#183; BGE-M3 &#183; median 220&#8211;254 ms per query on CPU</text>
</svg>